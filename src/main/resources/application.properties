spring.application.name=demo

# Default local development database: H2 in-memory so the app starts without a running Postgres instance.
spring.datasource.url=jdbc:h2:mem:ohellen;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=change-me-to-a-strong-secret-of-at-least-32-bytes
jwt.expiration-ms=3600000
